<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Aglow</title>
    <meta name="description" content="Turn the wires. Light the tree. A holiday light puzzle." />
    <meta name="theme-color" content="#0b0604" />
    <meta property="og:title" content="Aglow" />
    <meta property="og:description" content="Turn the wires. Light the tree." />
    <meta property="og:image" content="https://aglow.lukeghanna.com/og.png" />
    <meta property="og:url" content="https://aglow.lukeghanna.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body data-scene="fireside">
    <canvas id="stage" aria-label="Christmas tree puzzle board"></canvas>
    <div class="grain" id="grain"></div>
    <div class="vignette"></div>

    <header class="wordmark"><span class="dot holly" aria-hidden="true"><svg viewBox="-3 -3 28 22" width="26" height="20" focusable="false">
        <defs>
          <linearGradient id="holly-l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cbd78"/><stop offset=".5" stop-color="#23703d"/><stop offset="1" stop-color="#0d3a1e"/></linearGradient>
          <linearGradient id="holly-r" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46a263"/><stop offset=".55" stop-color="#1b5c32"/><stop offset="1" stop-color="#0a2c17"/></linearGradient>
          <radialGradient id="holly-b" cx=".34" cy=".3" r=".8"><stop offset="0" stop-color="#ff9f8f"/><stop offset=".38" stop-color="#e0303c"/><stop offset="1" stop-color="#5e0410"/></radialGradient>
          <radialGradient id="holly-hot" cx=".4" cy=".38" r=".7"><stop offset="0" stop-color="#fff1e6"/><stop offset=".45" stop-color="#ff6a5c"/><stop offset="1" stop-color="#ff3a3a" stop-opacity="0"/></radialGradient>
          <radialGradient id="holly-glow"><stop offset="0" stop-color="#ff5a48" stop-opacity=".85"/><stop offset=".5" stop-color="#ff4a3a" stop-opacity=".25"/><stop offset="1" stop-color="#ff4a3a" stop-opacity="0"/></radialGradient>
        </defs>
        <circle class="holly-glow" cx="11" cy="10.6" r="11" fill="url(#holly-glow)" />
        <path d="M1 9c3-1 4-5 8-5-1 2 1 3 0 5 1 0 2 1 2 2-3 0-4 3-8 3 1-2-1-3 0-4-1 0-2 0-2-1z" fill="url(#holly-l)" />
        <path d="M2.2 9.2Q6 7.6 10.6 10.6" fill="none" stroke="rgba(200,240,170,.4)" stroke-width=".45" />
        <path d="M21 9c-3-1-4-5-8-5 1 2-1 3 0 5-1 0-2 1-2 2 3 0 4 3 8 3-1-2 1-3 0-4 1 0 2 0 2-1z" fill="url(#holly-r)" />
        <path d="M19.8 9.2Q16 7.6 11.4 10.6" fill="none" stroke="rgba(200,240,170,.3)" stroke-width=".45" />
        <g fill="url(#holly-b)"><circle cx="9.3" cy="9.6" r="2.3" /><circle cx="12.9" cy="9.2" r="2.3" /><circle cx="11" cy="12.3" r="2.3" /></g>
        <g class="holly-hot" fill="url(#holly-hot)"><circle cx="9.3" cy="9.6" r="2.3" /><circle cx="12.9" cy="9.2" r="2.3" /><circle cx="11" cy="12.3" r="2.3" /></g>
        <g fill="#fff"><circle cx="8.5" cy="8.8" r=".65" opacity=".75" /><circle cx="12.2" cy="8.4" r=".55" opacity=".6" /><circle cx="10.3" cy="11.5" r=".55" opacity=".6" /></g>
      </svg></span>Aglow</header>

    <div class="hud">
      <div id="radio-slot"></div>
      <div class="pill time" id="time" aria-label="Time">0:00</div>
      <button class="pill icon" id="menu-btn" aria-label="Settings" aria-expanded="false">···</button>
    </div>

    <div class="intro" id="intro">Turn the wires. Light the tree.</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="menu" id="menu" role="dialog" aria-label="Settings" hidden>
      <svg class="bow" viewBox="0 0 64 40" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="bow-loop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3a4"/><stop offset=".45" stop-color="#d9a74e"/><stop offset="1" stop-color="#8f5f1e"/></linearGradient>
          <linearGradient id="bow-tail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c16c"/><stop offset="1" stop-color="#90601f"/></linearGradient>
          <radialGradient id="bow-knot" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff2c8"/><stop offset=".5" stop-color="#e2b25a"/><stop offset="1" stop-color="#8a5a1c"/></radialGradient>
        </defs>
        <path d="M29 22l-10 16 6-2.2 3.4 3.6 3.2-16.4zM35 22l10 16-6-2.2-3.4 3.6-3.2-16.4z" fill="url(#bow-tail)" />
        <path d="M32 20C22 4 5 3 7 15c1 8 14 9 25 5z" fill="url(#bow-loop)" />
        <path d="M32 20C42 4 59 3 57 15c-1 8-14 9-25 5z" fill="url(#bow-loop)" />
        <path d="M30 19C22 9 12 7 11 13c0 3 4 5 10 5M34 19C42 9 52 7 53 13c0 3-4 5-10 5" fill="none" stroke="rgba(90,52,10,.45)" stroke-width="1.2" />
        <path d="M12 9.5c4-3 10-1 15 5M52 9.5c-4-3-10-1-15 5" fill="none" stroke="rgba(255,248,220,.7)" stroke-width=".9" stroke-linecap="round" />
        <ellipse cx="32" cy="20" rx="5.2" ry="4.6" fill="url(#bow-knot)" />
      </svg>
      <button class="newtree" id="new-tree">New tree</button>
      <div>
        <p class="lbl">Scene</p>
        <div class="seg" data-setting="scene">
          <button data-value="auto">Auto</button><button data-value="midnight">Midnight</button><button data-value="fireside">Fireside</button><button data-value="frost">Frost</button>
        </div>
      </div>
      <div>
        <p class="lbl">Light path</p>
        <div class="seg" data-setting="pathStyle">
          <button data-value="filament">Filament</button><button data-value="fairy">Fairy lights</button><button data-value="neon">Neon</button>
        </div>
      </div>
      <div>
        <p class="lbl">Effects volume</p>
        <input type="range" id="effects-volume" min="0" max="1" step="0.05" aria-label="Effects volume" />
      </div>
      <label class="row" id="haptics-row"><span>Haptics</span><input type="checkbox" id="haptics" /></label>
    </div>

    <div class="pause" id="pause" hidden><div><div class="big">Paused</div><small>Tap to resume</small></div></div>

    <section class="results" id="results" hidden aria-live="polite">
      <h2 id="r-time">Lit in 0:00</h2>
      <div class="merry" id="r-merry">Merry &amp; bright</div>
      <div class="score" id="r-score">Score 0</div>
      <div class="badge" id="r-badge">New best</div>
      <div class="stats">
        <div><b id="r-solved">1</b><span>Solved</span></div>
        <div><b id="r-avg">0:00</b><span>Average</span></div>
        <div><b id="r-streak">1</b><span>Day streak</span></div>
      </div>
      <div class="actions"><button class="primary" id="r-new">New tree</button><button id="r-share">Share</button></div>
      <button class="keep" id="r-keep">Keep watching</button>
    </section>

    <button class="pill corner" id="corner-new" hidden>New tree</button>
    <button class="pill corner" id="zoom-reset" hidden>Reset view</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
