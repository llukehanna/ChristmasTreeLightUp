<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aglow icons</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #0d0907; color: #efe2cc; font: 14px/1.5 Inter, system-ui, sans-serif; padding: 28px 28px 60px; }
  h1 { font: italic 400 34px 'Instrument Serif', serif; margin: 0 0 4px; }
  p.note { opacity: .65; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 18px; }
  .card { background: #17110d; border: 1px solid #2a211a; border-radius: 16px; padding: 16px; }
  .sizes { display: flex; gap: 14px; align-items: end; }
  .num { font: 600 11px Inter; letter-spacing: .2em; color: #d8b46a; }
  .card b { display: block; margin-top: 10px; font-size: 13.5px; }
  .card small { opacity: .55; font-size: 12px; display: block; min-height: 36px; }
  .tabs { margin-top: 10px; display: grid; gap: 6px; }
  .tab { display: flex; align-items: center; gap: 7px; border-radius: 8px 8px 0 0; padding: 6px 10px; font-size: 12px; }
  .tab.dark { background: #2b2c2f; color: #ddd; } .tab.light { background: #eceef1; color: #222; }
  .home { margin-top: 10px; display: flex; gap: 10px; align-items: center; background: linear-gradient(135deg, #3a5d8f, #7b5aa6); padding: 10px; border-radius: 12px; font-size: 10px; color: #fff; }
  .home img { border-radius: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
</style>
</head>
<body>
<h1>Icon options</h1>
<p class="note">Each option is shown at 128, 32 and 16px, in dark and light browser tabs, and as a home-screen icon.</p>
<div class="grid" id="grid"></div>
<script>
const BG = '<rect width="64" height="64" rx="14" fill="#170d07"/>';
const glow = (id, c, cx = .5, cy = .55, o = .5) => `<radialGradient id="${id}" cx="${cx}" cy="${cy}" r=".6"><stop offset="0" stop-color="${c}" stop-opacity="${o}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`;
const star = (x, y, r, fill = '#ffe29a') => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; d += (i ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(2) + ' ' + (y + rr * Math.sin(a)).toFixed(2); } return `<path d="${d}Z" fill="${fill}"/>`; };
const blur = '<filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3"/></filter>';

const OPTIONS = [
  ['Lit tree', 'Fir, glowing wires, bulbs and a gold star. The puzzle in one glyph.',
    `<defs>${glow('g', '#ffae55', .5, .6)}<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7a45"/><stop offset="1" stop-color="#174a2a"/></linearGradient>${blur}</defs>${BG}<circle cx="32" cy="38" r="28" fill="url(#g)"/><path d="M32 12 L50 50 H14 Z" fill="url(#f)"/><rect x="29" y="50" width="6" height="6" rx="1" fill="#6b3d1f"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M32 20v30M32 28h-5M32 36h8M32 44h-11M32 44h10" stroke="#ffc062" stroke-width="3.2" filter="url(#bl)"/><path d="M32 20v30M32 28h-5M32 36h8M32 44h-11M32 44h10" stroke="#fff4d8" stroke-width="1.5"/></g><circle cx="26" cy="28" r="2.8" fill="#ff4d4d"/><circle cx="41" cy="36" r="2.8" fill="#ffd05a"/><circle cx="20" cy="44" r="2.8" fill="#5aa8ff"/><circle cx="43" cy="44" r="2.8" fill="#ff4d4d"/>${star(32, 10, 6.5)}`],
  ['Red bauble', 'Classic glass ornament with a gold cap. Reads "Christmas" instantly.',
    `<defs><radialGradient id="b" cx=".36" cy=".34" r=".75"><stop offset="0" stop-color="#ff7a6a"/><stop offset=".45" stop-color="#c3182a"/><stop offset="1" stop-color="#4d0610"/></radialGradient><linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#a8762c"/><stop offset=".5" stop-color="#ffe3a0"/><stop offset="1" stop-color="#9c6a24"/></linearGradient>${glow('h', '#ff5a4a', .5, .6, .45)}</defs>${BG}<circle cx="32" cy="38" r="27" fill="url(#h)"/><circle cx="32" cy="38" r="18" fill="url(#b)"/><ellipse cx="25" cy="31" rx="5" ry="3.2" fill="#fff" opacity=".55" transform="rotate(-35 25 31)"/><rect x="27" y="17" width="10" height="5" rx="1.2" fill="url(#c)"/><circle cx="32" cy="14.5" r="3" fill="none" stroke="#e8c070" stroke-width="1.6"/>`],
  ['Bauble with lit band', 'Green glass bauble wrapped in a glowing filament band. Ornament plus wire.',
    `<defs><radialGradient id="b" cx=".36" cy=".34" r=".75"><stop offset="0" stop-color="#5fd08a"/><stop offset=".5" stop-color="#1d6b3c"/><stop offset="1" stop-color="#082a16"/></radialGradient><linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#a8762c"/><stop offset=".5" stop-color="#ffe3a0"/><stop offset="1" stop-color="#9c6a24"/></linearGradient>${glow('h', '#ffb35c', .5, .6, .4)}${blur}<clipPath id="k"><circle cx="32" cy="38" r="18"/></clipPath></defs>${BG}<circle cx="32" cy="38" r="27" fill="url(#h)"/><circle cx="32" cy="38" r="18" fill="url(#b)"/><g clip-path="url(#k)"><path d="M12 40 Q32 30 52 40" stroke="#ffc062" stroke-width="4" fill="none" filter="url(#bl)"/><path d="M12 40 Q32 30 52 40" stroke="#fff4d8" stroke-width="1.6" fill="none"/></g><circle cx="22" cy="37.5" r="2" fill="#ff4d4d"/><circle cx="32" cy="35" r="2" fill="#ffd05a"/><circle cx="42" cy="37.5" r="2" fill="#5aa8ff"/><ellipse cx="25" cy="29" rx="4.5" ry="2.6" fill="#fff" opacity=".45" transform="rotate(-35 25 29)"/><rect x="27" y="17" width="10" height="5" rx="1.2" fill="url(#c)"/><circle cx="32" cy="14.5" r="3" fill="none" stroke="#e8c070" stroke-width="1.6"/>`],
  ['C9 bulb', 'Retro string-light bulb with a green socket.',
    `<defs>${glow('g', '#ff9e45', .5, .55, .7)}<linearGradient id="cb" x1="0" x2="1"><stop offset="0" stop-color="#ffb14a"/><stop offset=".45" stop-color="#fff0c4"/><stop offset="1" stop-color="#ff8a2a"/></linearGradient></defs>${BG}<circle cx="32" cy="38" r="26" fill="url(#g)"/><g transform="rotate(-18 32 34)"><path d="M32 57c-8 0-11-9-11-16 0-8 5-15 11-15s11 7 11 15c0 7-3 16-11 16z" fill="url(#cb)"/><rect x="26.5" y="15" width="11" height="12" rx="2" fill="#1f5a34"/><path d="M26.5 19h11M26.5 23h11" stroke="#133b22" stroke-width="1.2"/></g><path d="M8 12 Q32 2 56 12" fill="none" stroke="#2c5a3a" stroke-width="2"/>`],
  ['String of lights', 'Three C9 bulbs on a swag of wire, echoing the new garland.',
    `<defs>${blur}</defs>${BG}<path d="M4 18 Q32 40 60 18" fill="none" stroke="#2c5a3a" stroke-width="2"/>${[[14, 26.5, '#ff4d4d', -24], [32, 30.5, '#ffd05a', 0], [50, 26.5, '#4fd17a', 24]].map(([x, y, c, r]) => `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse cy="15" rx="9" ry="11" fill="${c}" opacity=".45" filter="url(#bl)"/><rect x="-3" y="-1" width="6" height="6" rx="1" fill="#1f5a34"/><path d="M0 24c-5 0-6.5-6-6.5-9.5 0-4.5 3-7 6.5-7s6.5 2.5 6.5 7c0 3.5-1.5 9.5-6.5 9.5z" fill="${c}"/><ellipse cx="-2.2" cy="12" rx="1.5" ry="3" fill="#fff" opacity=".6"/></g>`).join('')}`],
  ['Gold star', 'A radiant tree-topper star. Elegant and simple.',
    `<defs>${glow('g', '#ffcc66', .5, .5, .6)}<linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#f1c35a"/><stop offset="1" stop-color="#b8802c"/></linearGradient></defs>${BG}<circle cx="32" cy="32" r="28" fill="url(#g)"/>${star(32, 33, 20, 'url(#s)')}<path d="M32 4v8M32 54v6M4 33h8M52 33h8" stroke="#ffe7a8" stroke-width="1" opacity=".5"/>`],
  ['Tree of lights', 'A fir drawn only in points of light, like the lit board from afar.',
    `<defs>${glow('g', '#ffb35c', .5, .6, .35)}</defs>${BG}<circle cx="32" cy="38" r="28" fill="url(#g)"/>${(() => { const cols = ['#ff4d4d', '#ffd05a', '#4fd17a', '#5aa8ff', '#fff1cc']; let s = '', k = 0; for (let r = 0; r < 6; r++) { const y = 19 + r * 6.2, n = r + 1, span = r * 5.4; for (let i = 0; i < n; i++) { const x = 32 - span / 2 + (n > 1 ? i * span / (n - 1) : 0); const c = cols[k++ % 5]; s += `<circle cx="${x}" cy="${y}" r="4.2" fill="${c}" opacity=".35"/><circle cx="${x}" cy="${y}" r="2.1" fill="${c}"/>`; } } return s; })()}${star(32, 11, 5.5)}<rect x="30" y="53" width="4" height="5" rx="1" fill="#6b3d1f"/>`],
  ['Monogram A-tree', 'A gilded "A" shaped like a fir, with a holly sprig. Ties the icon to the wordmark.',
    `<defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset=".45" stop-color="#e2b25a"/><stop offset="1" stop-color="#a8732a"/></linearGradient>${glow('g', '#ffc46b', .5, .5, .3)}</defs><rect width="64" height="64" rx="14" fill="#5a0d16"/><circle cx="32" cy="32" r="28" fill="url(#g)"/><path d="M32 10 L50 52 H42.5 L39 43.5 H25 L21.5 52 H14 Z M32 25 L27.4 37.5 H36.6 Z" fill="url(#gd)"/>${star(32, 9.5, 5)}<g transform="translate(39 46)"><path d="M0 4c3-1 4-5 8-5-1 2 1 3 0 5 1 0 2 1 2 2-3 0-4 3-8 3 1-2-1-3 0-4-1 0-2 0-2-1z" fill="#2f8a4d"/><circle cx="1" cy="5" r="2.2" fill="#ef4450"/><circle cx="4" cy="6.5" r="2.2" fill="#c8202e"/></g>`],
  ['Wreath', 'A lit wreath with a red bow.',
    `<defs>${glow('g', '#ffc46b', .5, .5, .35)}</defs>${BG}<circle cx="32" cy="32" r="28" fill="url(#g)"/><circle cx="32" cy="32" r="16" fill="none" stroke="#1f6a3b" stroke-width="9"/><circle cx="32" cy="32" r="16" fill="none" stroke="#2f8a4d" stroke-width="3" stroke-dasharray="3 4"/><circle cx="32" cy="16" r="2.2" fill="#ffe7a8"/><circle cx="47" cy="27" r="2.2" fill="#ff5a4a"/><circle cx="42" cy="45" r="2.2" fill="#ffe7a8"/><circle cx="22" cy="45" r="2.2" fill="#ff5a4a"/><circle cx="17" cy="27" r="2.2" fill="#ffe7a8"/><path d="M26 49l6-5 6 5-2 7-4-3-4 3z" fill="#c3182a"/><circle cx="32" cy="46" r="2.4" fill="#e23344"/>`],
  ['Present', 'A wrapped gift with a gold bow, matching the presents under the tree.',
    `<defs>${glow('g', '#ffc46b', .5, .6, .35)}<linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d23a3f"/><stop offset="1" stop-color="#7a1020"/></linearGradient></defs>${BG}<circle cx="32" cy="40" r="28" fill="url(#g)"/><rect x="13" y="27" width="38" height="28" rx="3" fill="url(#p)"/><rect x="11" y="23" width="42" height="8" rx="2" fill="#b3202c"/><rect x="29" y="23" width="6" height="32" fill="#e9c77c"/><path d="M32 23c-6-10-16-8-13-2 2 3 8 3 13 2zM32 23c6-10 16-8 13-2-2 3-8 3-13 2z" fill="#f1cd7c" stroke="#a87526"/><circle cx="32" cy="22.5" r="3" fill="#e9c77c" stroke="#a87526"/>`],
  ['Snow globe', 'A tiny lit tree inside a glass globe with falling snow.',
    `<defs><radialGradient id="gl" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#3a4e6e"/><stop offset="1" stop-color="#101a2c"/></radialGradient><linearGradient id="bs" x1="0" x2="1"><stop offset="0" stop-color="#7a4a24"/><stop offset=".5" stop-color="#c78a4a"/><stop offset="1" stop-color="#6a3c1c"/></linearGradient></defs>${BG}<circle cx="32" cy="29" r="20" fill="url(#gl)"/><path d="M32 16 L42 38 H22 Z" fill="#2f7a45"/><circle cx="29" cy="28" r="1.6" fill="#ffd05a"/><circle cx="35" cy="32" r="1.6" fill="#ff4d4d"/><circle cx="28" cy="35" r="1.6" fill="#5aa8ff"/>${star(32, 15, 3.4)}<path d="M14 38 Q32 46 50 38 L50 40 Q32 48 14 40Z" fill="#e8eef5" opacity=".9"/>${[[20, 22], [44, 20], [24, 14], [40, 12], [18, 30], [46, 30]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1" fill="#fff" opacity=".85"/>`).join('')}<ellipse cx="24" cy="18" rx="4" ry="2.2" fill="#fff" opacity=".25" transform="rotate(-35 24 18)"/><path d="M16 45 H48 L51 56 H13 Z" fill="url(#bs)"/>`],
  ['Plug to star', 'A single glowing wire from the plug up to a star: "light the tree" as a line.',
    `<defs>${glow('g', '#ffae55', .5, .55, .45)}${blur}</defs>${BG}<circle cx="32" cy="34" r="28" fill="url(#g)"/><path d="M32 18 L32 24 L24 24 L24 32 L40 32 L40 40 L22 40 L22 48 L32 48 L32 54" fill="none" stroke="#ffc062" stroke-width="4" stroke-linejoin="round" filter="url(#bl)"/><path d="M32 18 L32 24 L24 24 L24 32 L40 32 L40 40 L22 40 L22 48 L32 48 L32 54" fill="none" stroke="#fff4d8" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="24" r="2.6" fill="#ff4d4d"/><circle cx="40" cy="32" r="2.6" fill="#4fd17a"/><circle cx="22" cy="40" r="2.6" fill="#ffd05a"/><circle cx="32" cy="55" r="3.2" fill="#fff8ec"/>${star(32, 13, 7)}`],
  ['Holly sprig', 'Two leaves and three berries: the wordmark mark on its own.',
    `<defs>${glow('g', '#ff5a4a', .5, .55, .3)}<linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fa05c"/><stop offset="1" stop-color="#1a5a31"/></linearGradient></defs>${BG}<circle cx="32" cy="34" r="28" fill="url(#g)"/><g transform="translate(32 34) scale(2.2) translate(-11 -9)"><path d="M1 9c3-1 4-5 8-5-1 2 1 3 0 5 1 0 2 1 2 2-3 0-4 3-8 3 1-2-1-3 0-4-1 0-2 0-2-1z" fill="url(#l)"/><path d="M21 9c-3-1-4-5-8-5 1 2-1 3 0 5-1 0-2 1-2 2 3 0 4 3 8 3-1-2 1-3 0-4 1 0 2 0 2-1z" fill="url(#l)"/><circle cx="9.3" cy="9.6" r="2.3" fill="#e0303c"/><circle cx="12.9" cy="9.2" r="2.3" fill="#c8202e"/><circle cx="11" cy="12.3" r="2.3" fill="#ef4450"/><circle cx="8.6" cy="8.8" r=".7" fill="#fff" opacity=".7"/></g>`],
  ['Candle', 'A single warm flame. Quiet and cosy, very Fireside.',
    `<defs>${glow('g', '#ffb35c', .5, .35, .6)}<linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8a2a"/><stop offset=".6" stop-color="#ffd27a"/><stop offset="1" stop-color="#fff6dc"/></linearGradient><linearGradient id="cd" x1="0" x2="1"><stop offset="0" stop-color="#e9dcc4"/><stop offset=".5" stop-color="#fff8ec"/><stop offset="1" stop-color="#cdbb9c"/></linearGradient></defs>${BG}<circle cx="32" cy="24" r="24" fill="url(#g)"/><path d="M32 8c5 7 7 11 7 15a7 7 0 0 1-14 0c0-4 2-8 7-15z" fill="url(#fl)"/><path d="M32 30v-4" stroke="#3a2a1a" stroke-width="1.4"/><rect x="24" y="31" width="16" height="25" rx="2" fill="url(#cd)"/><rect x="20" y="54" width="24" height="4" rx="2" fill="#b3202c"/><path d="M26 44h12" stroke="#1f6a3b" stroke-width="3"/><circle cx="32" cy="44" r="1.8" fill="#e0303c"/>`],
  ['Tree on cranberry', 'The lit tree on a cranberry tile instead of near-black. Warmer on light tabs.',
    `<defs>${glow('g', '#ffd07a', .5, .6, .35)}<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9055"/><stop offset="1" stop-color="#1b5a31"/></linearGradient><linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8e1622"/><stop offset="1" stop-color="#4d0610"/></linearGradient>${blur}</defs><rect width="64" height="64" rx="14" fill="url(#bgc)"/><circle cx="32" cy="38" r="28" fill="url(#g)"/><path d="M32 12 L50 50 H14 Z" fill="url(#f)"/><rect x="29" y="50" width="6" height="6" rx="1" fill="#6b3d1f"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M32 20v30M32 28h-5M32 36h8M32 44h-11M32 44h10" stroke="#ffc062" stroke-width="3.2" filter="url(#bl)"/><path d="M32 20v30M32 28h-5M32 36h8M32 44h-11M32 44h10" stroke="#fff4d8" stroke-width="1.5"/></g><circle cx="26" cy="28" r="2.8" fill="#ffd05a"/><circle cx="41" cy="36" r="2.8" fill="#fff1cc"/><circle cx="20" cy="44" r="2.8" fill="#5aa8ff"/><circle cx="43" cy="44" r="2.8" fill="#ffd05a"/>${star(32, 10, 6.5)}`],
  ['Gold bauble, etched', 'A gold ornament with an etched snowflake. Luxe and restrained.',
    `<defs><radialGradient id="b" cx=".36" cy=".32" r=".8"><stop offset="0" stop-color="#fff2c4"/><stop offset=".45" stop-color="#d9a647"/><stop offset="1" stop-color="#5e3a10"/></radialGradient><linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#7a5020"/><stop offset=".5" stop-color="#e8c784"/><stop offset="1" stop-color="#6e4718"/></linearGradient>${glow('h', '#ffcc66', .5, .6, .4)}</defs><rect width="64" height="64" rx="14" fill="#123a24"/><circle cx="32" cy="38" r="27" fill="url(#h)"/><circle cx="32" cy="38" r="18" fill="url(#b)"/><g stroke="#7a4d16" stroke-width="1.3" stroke-linecap="round" opacity=".75"><path d="M32 28v20M23.3 33l17.4 10M23.3 43l17.4-10"/><path d="M30 30l2 2 2-2M30 46l2-2 2 2M24.5 36l2.6-.6-.6-2.6M39.5 40l-2.6.6.6 2.6M24.5 40l2.6.6-.6 2.6M39.5 36l-2.6-.6.6-2.6"/></g><ellipse cx="25" cy="30" rx="4.5" ry="2.6" fill="#fff" opacity=".45" transform="rotate(-35 25 30)"/><rect x="27" y="17" width="10" height="5" rx="1.2" fill="url(#c)"/><circle cx="32" cy="14.5" r="3" fill="none" stroke="#e8c070" stroke-width="1.6"/>`],
];

const grid = document.getElementById('grid');
OPTIONS.forEach(([name, desc, body], i) => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">${body}</svg>`;
  const url = 'data:image/svg+xml,' + encodeURIComponent(svg);
  grid.insertAdjacentHTML('beforeend', `<div class="card"><div class="num">${String(i + 1).padStart(2, '0')}</div><div class="sizes"><img src="${url}" width="128"><img src="${url}" width="32"><img src="${url}" width="16"></div><b>${name}</b><small>${desc}</small><div class="tabs"><div class="tab dark"><img src="${url}" width="16">Aglow</div><div class="tab light"><img src="${url}" width="16">Aglow</div></div><div class="home"><img src="${url}" width="46">Aglow</div></div>`);
});
</script>
</body>
</html>
